<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle inner card -->
  <rect x="56" y="56" width="400" height="400" rx="90" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- Glowing Checklist & Lightning/Spark MCQ Symbol -->
  <g filter="url(#shadow)">
    <!-- MCQ Option 1 with checked mark -->
    <rect x="110" y="140" width="60" height="60" rx="18" fill="url(#accent)"/>
    <path d="M124 170 L136 182 L156 156" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="195" y="152" width="200" height="36" rx="12" fill="#FFFFFF" fill-opacity="0.95"/>
    
    <!-- MCQ Option 2 -->
    <rect x="110" y="226" width="60" height="60" rx="18" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="4"/>
    <circle cx="140" cy="256" r="12" fill="#F43F5E"/>
    <rect x="195" y="238" width="160" height="36" rx="12" fill="rgba(255,255,255,0.85)"/>
    
    <!-- MCQ Option 3 -->
    <rect x="110" y="312" width="60" height="60" rx="18" fill="rgba(255,255,255,0.15)"/>
    <circle cx="140" cy="342" r="10" fill="rgba(255,255,255,0.4)"/>
    <rect x="195" y="324" width="180" height="36" rx="12" fill="rgba(255,255,255,0.7)"/>

    <!-- Dynamic Spark Badge -->
    <polygon points="380,105 400,140 435,145 408,170 415,205 380,186 345,205 352,170 325,145 360,140" fill="#FBBF24"/>
  </g>
</svg>
