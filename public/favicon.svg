<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B20" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Stylized Open Book / Pages with 'V' Geometry -->
  <!-- Left Page -->
  <path d="M14 20 C22 18, 30 20, 32 24 L32 46 C30 43, 22 41, 14 43 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Right Page -->
  <path d="M50 20 C42 18, 34 20, 32 24 L32 46 C34 43, 42 41, 50 43 Z" fill="url(#goldGrad)" />

  <!-- Center Spine Highlight -->
  <line x1="32" y1="22" x2="32" y2="48" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Top Academic Star / Diamond Accent -->
  <polygon points="32,11 34.5,15.5 39,16 35.5,19 36.5,23.5 32,21 27.5,23.5 28.5,19 25,16 29.5,15.5" fill="url(#goldGrad)" />

  <!-- Dynamic checkmark/pen swoop at the bottom -->
  <path d="M22 34 L28 40 L42 26" fill="none" stroke="#0B0C0E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
